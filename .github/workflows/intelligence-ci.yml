name: Intelligence CI

on:
  push:
    paths:
      - "intelligence/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - "intelligence/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:packages
      - run: npm run test --workspace=@ev-mobility/traffic-engine

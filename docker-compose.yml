services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: volttwin
      POSTGRES_USER: volttwin
      POSTGRES_PASSWORD: volttwin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volttwin -d volttwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres-data:

version: "3.8"

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: paypark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paypark
      POSTGRES_PASSWORD: paypark
      POSTGRES_DB: paypark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MQTT Broker (Eclipse Mosquitto) ──────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: paypark-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log

volumes:
  pgdata:
  mosquitto-data:
  mosquitto-logs:
